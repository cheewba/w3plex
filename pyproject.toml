[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "w3plex"
authors = [
    {name = "cheewba", email = "chewba34@gmail.com"},
]
description = "Web3 multi-processor"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "loguru==0.7.*",
    "ruamel.yaml==0.17.32",
    "aiohttp==3.11.*",
    "aiohttp_socks==0.10.*",
    'ptpython==3.0.23',
    'rich==13.*',
    'cryptography==45.*',
    'python-dotenv',
    "w3ext @ git+https://github.com/cheewba/w3ext.git@0.0.5#egg=w3ext",
    "lazyplex @ git+https://github.com/cheewba/lazyplex.git@0.0.4#egg=lazyplex",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[project.scripts]
w3plex = "w3plex.main:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
exclude = ["build", "dist"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Logging fallbacks and dashboard cleanup must tolerate arbitrary sink failures.
"src/w3plex/log.py" = ["BLE001", "S110"]
"src/w3plex/plugins/dashboard.py" = ["BLE001", "S110"]

[tool.ruff.format]
line-ending = "lf"
