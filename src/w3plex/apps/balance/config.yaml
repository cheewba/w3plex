__init__: w3plex.apps.balance:balance
# Public EVM addresses, one per line. No private keys are needed.
wallets:
  __init__: w3plex.utils.loader:wallets_loader
  file: wallets.txt
actions:
  onchain:
    tokens:
      - "ethereum:ETH"
    threads: 1
    attempts: 2
  debank-total:
    action: 'debank'
    total: true
    cache_only: true
  debank:
    total: false
    threads: 1
    filter:
      - "*:*"
